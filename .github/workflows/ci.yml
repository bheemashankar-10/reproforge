name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Prepare sandbox image
        run: docker pull python:3.12-alpine

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Worker tests
        run: node --test cloudflare-worker/test/worker.test.mjs

      - name: Check Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.local.yml config --quiet

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
