services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: reproforge
      API_KEY: ${API_KEY}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  api-proxy:
    image: node:22-slim
    working_dir: /worker
    volumes:
      - ./cloudflare-worker:/worker
    command:
      - sh
      - -c
      - npx --yes wrangler@4 dev --ip 0.0.0.0 --port 8787 --var BACKEND_URL:http://backend:8000 --var "BACKEND_API_KEY:$${API_KEY}" --var ALLOWED_ORIGINS:http://localhost:8080
    environment:
      API_KEY: ${API_KEY}
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      - backend

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: http://localhost:8787
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api-proxy

volumes:
  mongodb_data:
