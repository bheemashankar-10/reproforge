services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8001:8000"

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "8080:80"
    depends_on:
      - backend
